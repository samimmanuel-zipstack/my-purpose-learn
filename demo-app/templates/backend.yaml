apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      volumes:
        - name: logs
          emptyDir: {}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: db-credentials
          volumeMounts:
            - { name: logs, mountPath: /var/log/app }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
        # sidecar: tails the backend's log file from the shared volume
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "tail -F /var/log/app/app.log"]
          volumeMounts:
            - { name: logs, mountPath: /var/log/app }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: {{ .Values.service.type }}
  selector: { app: backend }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: {{ .Values.service.nodePort }}
